name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          PLUGIN_VER="$(node -p "require('./plugin.json').version")"
          if [ "$TAG" != "$PKG_VER" ] || [ "$TAG" != "$PLUGIN_VER" ]; then
            echo "Version mismatch: tag=$GITHUB_REF_NAME, package.json=$PKG_VER, plugin.json=$PLUGIN_VER" >&2
            exit 1
          fi

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; skipping creation."
            exit 0
          fi
          EXTRA_ARGS="--latest"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            EXTRA_ARGS="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${EXTRA_ARGS}
