<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Prompt Rewriter</title>
  <style>:root {
  color-scheme: light dark;
  --bg-primary: var(--color-background-primary, #ffffff);
  --bg-secondary: var(--color-background-secondary, #f6f7f9);
  --bg-tertiary: var(--color-background-tertiary, #eef0f4);
  --bg-info: var(--color-background-info, #e0f2fe);
  --menu-bg: var(--color-background-primary, #ffffff);
  --control-bg: var(--color-background-primary, #f6f7f9);
  --text-primary: var(--color-text-primary, #111827);
  --text-secondary: var(--color-text-secondary, #4b5563);
  --text-tertiary: var(--color-text-tertiary, #6b7280);
  --text-danger: var(--color-text-danger, #dc2626);
  --text-success: var(--color-text-success, #16a34a);
  --text-info: var(--color-text-info, #0284c7);
  --border-primary: var(--color-border-primary, #e5e7eb);
  --border-secondary: var(--color-border-secondary, #d1d5db);
  --accent: var(--color-ring-primary, #4f46e5);
  --accent-text: #ffffff;
  --font-ui: var(--font-sans, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
}

[data-theme="light"] {
  color-scheme: light;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg-primary: var(--color-background-primary, #111318);
  --bg-secondary: var(--color-background-secondary, #1a1d24);
  --bg-tertiary: var(--color-background-tertiary, #232732);
  --bg-info: var(--color-background-info, rgba(56, 189, 248, 0.14));
  --menu-bg: var(--color-background-primary, #111318);
  --control-bg: var(--color-background-primary, #1a1d24);
  --text-primary: var(--color-text-primary, #f3f4f6);
  --text-secondary: var(--color-text-secondary, #9ca3af);
  --text-tertiary: var(--color-text-tertiary, #6b7280);
  --text-danger: var(--color-text-danger, #f87171);
  --text-success: var(--color-text-success, #4ade80);
  --text-info: var(--color-text-info, #38bdf8);
  --border-primary: var(--color-border-primary, #2a2f3a);
  --border-secondary: var(--color-border-secondary, #374151);
  --accent: var(--color-ring-primary, #6366f1);
}

@supports (color: color-mix(in srgb, red, blue)) {
  :root,
  [data-theme="light"],
  [data-theme="dark"] {
    --control-bg: color-mix(in srgb, var(--bg-primary) 92%, var(--text-primary) 8%);
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.5;
}

.app-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 320px;
  max-width: 960px;
  margin: 0 auto;
  padding: 10px 12px;
  gap: 8px;
}

html.is-inline,
body.is-inline {
  height: auto;
}

.is-inline .app-shell {
  height: auto;
  min-height: 0;
  padding: 8px 10px;
}

.is-inline .editor-wrap {
  min-height: 120px;
  flex: none;
}

.is-inline .prompt-textarea {
  flex: none;
  min-height: 120px;
  max-height: 440px;
  overflow-y: auto;
}

.is-global .app-shell {
  padding: 14px 16px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.topbar-left,
.topbar-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

.mode-select {
  appearance: none;
  height: 28px;
  min-width: 68px;
  padding: 0 11px;
  border-radius: 8px;
  background-color: var(--control-bg);
  color: var(--text-primary);
  border: 1px solid var(--border-primary);
  font-size: 12px;
  line-height: 1;
  font-family: inherit;
  text-align: center;
  text-align-last: center;
  cursor: pointer;
  outline: none;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}

.mode-select:hover {
  background-color: var(--bg-tertiary);
  border-color: var(--border-secondary);
}

.mode-select:focus {
  border-color: var(--accent);
}

.mode-select option,
.select option {
  background-color: var(--menu-bg);
  color: var(--text-primary);
  text-align: left;
}

@supports (appearance: base-select) {
  .mode-select,
  .mode-select::picker(select) {
    appearance: base-select;
  }

  .mode-select {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .mode-select::picker-icon {
    display: none;
  }

  .mode-select::picker(select) {
    margin-block-start: 4px;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid var(--border-secondary);
    background-color: var(--menu-bg);
    color: var(--text-primary);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
  }

  .mode-select option {
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    background-color: transparent;
    color: var(--text-primary);
    cursor: pointer;
  }

  .mode-select option:hover,
  .mode-select option:focus {
    background-color: var(--bg-tertiary);
  }

  .mode-select option:checked {
    background-color: var(--bg-info);
    color: var(--text-primary);
  }

  .mode-select option::checkmark {
    color: var(--accent);
  }
}

.engine-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  padding: 0 11px;
  border-radius: 8px;
  background-color: var(--control-bg);
  border: 1px solid var(--border-primary);
  color: var(--text-secondary);
  font-size: 12px;
  line-height: 1;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.quick-popover {
  width: min(290px, calc(100vw - 20px));
  max-height: calc(100vh - 54px);
  overflow-y: auto;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border-secondary);
  background: var(--bg-primary);
  color: var(--text-primary);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
}

.quick-popover[hidden] {
  display: none;
}

@supports not selector(:popover-open) {
  [popover]:not(.\:popover-open) {
    display: none;
  }
}

@supports (position-area: block-end) {
  .quick-popover {
    inset: auto;
    margin: 0;
    margin-block-start: 6px;
    position-area: block-end span-inline-start;
    position-try-fallbacks: flip-block, flip-inline, flip-block flip-inline;
  }
}

@supports not (position-area: block-end) {
  .quick-popover {
    position: fixed;
    inset: 46px 10px auto auto;
    margin: 0;
  }
}

.quick-popover-header {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-primary);
  margin-bottom: 8px;
}

.quick-popover-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.quick-popover-body .field-row {
  gap: 3px;
}

.quick-popover-body .field-row[hidden] {
  display: none;
}

.quick-popover-hint {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border-primary);
  font-size: 11px;
  line-height: 1.45;
  color: var(--text-tertiary);
}

.view-panel {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  gap: 8px;
}

.view-panel[hidden] {
  display: none;
}

.editor-wrap {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 180px;
  border: 1px solid var(--border-primary);
  border-radius: 10px;
  background: var(--bg-secondary);
  overflow: hidden;
  transition: border-color 0.15s ease;
}

.editor-wrap:focus-within {
  border-color: var(--accent);
}

.prompt-textarea {
  flex: 1;
  width: 100%;
  min-height: 160px;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: 13.5px;
  line-height: 1.6;
  padding: 12px 14px;
}

.prompt-textarea::placeholder {
  color: var(--text-tertiary);
}

.status-strip {
  font-size: 11.5px;
  padding: 5px 10px;
  border-radius: 7px;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  border: 1px solid var(--border-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.status-strip[hidden] {
  display: none;
}

.status-strip.error {
  color: var(--text-danger);
  border-color: var(--text-danger);
}

.status-strip.info {
  background: var(--bg-info);
  color: var(--text-info);
  border-color: transparent;
}

.bottom-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 2px;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid var(--border-primary);
  background: var(--bg-secondary);
  color: var(--text-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}

.icon-btn:hover:not(:disabled) {
  background: var(--bg-tertiary);
  border-color: var(--border-secondary);
}

.icon-btn:active:not(:disabled) {
  transform: scale(0.95);
}

.icon-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.icon-btn[hidden] {
  display: none;
}

.icon-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  width: 38px;
  border-radius: 10px;
}

.icon-btn.primary:hover:not(:disabled) {
  filter: brightness(1.08);
  background: var(--accent);
}

.icon-btn.active {
  border-color: var(--accent);
  color: var(--accent);
}

.icon-btn.success {
  border-color: var(--text-success);
  color: var(--text-success);
}

.icon-btn svg {
  width: 17px;
  height: 17px;
  display: block;
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.icon-btn.spinning svg {
  animation: spin 1s linear infinite;
}

/* Settings view */
.settings-scroll {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-right: 2px;
}

.section-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  border-radius: 10px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.section-title {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

.engine-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
  gap: 8px;
}

.engine-card {
  text-align: left;
  background: var(--bg-primary);
  border: 1.5px solid var(--border-primary);
  border-radius: 9px;
  padding: 9px 10px;
  cursor: pointer;
  color: var(--text-primary);
  font-family: inherit;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.engine-card.selected {
  border-color: var(--accent);
  background: var(--bg-info);
}

.engine-card-title {
  font-size: 12.5px;
  font-weight: 600;
}

.engine-card-desc {
  font-size: 11px;
  color: var(--text-secondary);
}

.field-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.field-row.inline {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.field-label {
  font-size: 12px;
  color: var(--text-secondary);
}

.field-hint {
  font-size: 11px;
  color: var(--text-tertiary);
}

.input,
.select,
.rule-textarea {
  width: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  border: 1px solid var(--border-primary);
  border-radius: 7px;
  padding: 6px 9px;
  font-size: 12.5px;
  font-family: inherit;
  outline: none;
}

.input:focus,
.select:focus,
.rule-textarea:focus {
  border-color: var(--accent);
}

.input-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-sm {
  border: 1px solid var(--border-primary);
  background: var(--bg-primary);
  color: var(--text-primary);
  border-radius: 7px;
  padding: 5px 10px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}

.btn-sm:hover:not(:disabled) {
  background: var(--bg-tertiary);
}

.btn-sm.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #ffffff;
}

.btn-sm.danger {
  color: var(--text-danger);
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 8px;
}

.rule-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.rule-item {
  background: var(--bg-primary);
  border: 1px solid var(--border-primary);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rule-item-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.rule-item-name {
  font-weight: 600;
  font-size: 12.5px;
}

.rule-item-preview {
  font-size: 11.5px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rule-form {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--bg-primary);
  border: 1px dashed var(--border-secondary);
  border-radius: 8px;
  padding: 10px;
}

.rule-form[hidden],
.subpanel[hidden],
.mode-guide-list[hidden] {
  display: none;
}

.mode-guide-wrap {
  display: flex;
  flex-direction: column;
}

.mode-guide-toggle {
  align-self: flex-start;
  border: none;
  background: transparent;
  padding: 2px 0;
  font-size: 12px;
  font-family: inherit;
  color: var(--text-secondary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.mode-guide-toggle:hover {
  color: var(--text-primary);
}

.mode-guide-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}

.mode-guide-card {
  width: 100%;
  text-align: left;
  background: var(--bg-primary);
  border: 1.5px solid var(--border-primary);
  border-radius: 9px;
  padding: 10px 12px;
  color: var(--text-primary);
  font-family: inherit;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: border-color 0.15s ease, background-color 0.15s ease;
}

.mode-guide-card:hover {
  border-color: var(--border-secondary);
}

.mode-guide-card.selected {
  border-color: var(--accent);
  background: var(--bg-info);
}

.mode-guide-head {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.mode-guide-title {
  font-size: 13px;
  font-weight: 600;
}

.mode-badge {
  font-size: 10.5px;
  line-height: 1.3;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid var(--border-secondary);
  color: var(--text-secondary);
  background: var(--bg-secondary);
}

.mode-badge.accent {
  border-color: var(--accent);
  color: var(--accent);
}

.mode-guide-summary {
  font-size: 12px;
  color: var(--text-primary);
  line-height: 1.5;
}

.mode-guide-meta {
  display: grid;
  grid-template-columns: 58px 1fr;
  gap: 4px 10px;
  font-size: 11.5px;
  line-height: 1.45;
}

.mode-guide-key {
  color: var(--text-tertiary);
}

.mode-guide-val {
  color: var(--text-secondary);
  min-width: 0;
  overflow-wrap: anywhere;
}

.settings-meta-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 0 2px;
}

.settings-meta-links {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

.meta-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 7px;
  font-size: 12px;
  color: var(--text-secondary);
  text-decoration: none;
  transition: color 0.15s ease, background-color 0.15s ease;
}

.meta-link:hover {
  color: var(--text-primary);
  background: var(--bg-secondary);
}

.meta-link:focus-visible,
.version-pill:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.meta-sep {
  color: var(--text-tertiary);
  font-size: 12px;
  user-select: none;
}

.meta-star {
  font-size: 12px;
  line-height: 1;
}

.meta-arrow {
  font-size: 11px;
  opacity: 0.75;
}

.version-pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  color: var(--text-secondary);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px;
  line-height: 1.4;
  text-decoration: none;
  transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
}

.version-pill:hover {
  color: var(--text-primary);
  border-color: var(--border-secondary);
  background: var(--bg-tertiary);
}
</style>
</head>
